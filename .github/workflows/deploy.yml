name: Deploy Scraper CSV to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ALT_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USERNAME }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          KEY_TO_USE="${SSH_KEY:-$ALT_SSH_KEY}"
          TARGET_HOST="${HOST:-165.101.215.46}"
          TARGET_USER="${USER:-root}"
          TARGET_PORT="${PORT:-22}"
          DEPLOY_PATH="/opt/scraper_csv"

          if [ -z "$KEY_TO_USE" ]; then
            echo "::error::SSH_KEY secret is not set in GitHub repository secrets!"
            exit 1
          fi

          echo "=========================================="
          echo "🚀 Connecting to VPS ($TARGET_USER@$TARGET_HOST:$TARGET_PORT)..."
          echo "=========================================="

          mkdir -p ~/.ssh
          printf "%s\n" "$KEY_TO_USE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -i ~/.ssh/id_deploy -p "$TARGET_PORT" -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" "
            set -e
            echo '📂 Updating code in $DEPLOY_PATH...'
            cd $DEPLOY_PATH
            git pull origin main
            echo '🐳 Rebuilding and starting container...'
            docker compose up -d --build
            docker image prune -f
            echo '✅ Container status:'
            docker ps --filter name=scraper-csv-app
          "

          echo "=========================================="
          echo "✅ Scraper CSV deployment completed successfully!"
          echo "=========================================="
